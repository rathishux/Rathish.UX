<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rathish Gandhi — UX/UI Designer</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect trick — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this for any unknown path; it re-encodes the path
      // into a query string and sends the browser back to index.html, which
      // index.html's own script then decodes back into a real route.
      var pathSegmentsToKeep = 0; // apex domain — nothing to keep
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
