<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Rathish.UX/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <!-- The site is light-only — this stops browsers in OS dark mode from
         painting their own dark UA background for the split second before
         the site's CSS loads (a black flash on first paint). -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Rathish Gandhi — Senior UX/UI Designer. Portfolio of product design work across SaaS, fintech, and enterprise platforms."
    />
    <title>Rathish Gandhi — UX/UI Designer</title>
    <link rel="canonical" href="https://rathishux.github.io/Rathish.UX/" />

    <!-- Open Graph / Twitter card. This is what LinkedIn, WhatsApp, Slack and
         iMessage read to build the link preview; without it they fall back to
         a bare URL. og:image has to be absolute — the scraper fetches these
         tags out of context and has no base to resolve a relative path
         against. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Ratz Gazette" />
    <meta property="og:url" content="https://rathishux.github.io/Rathish.UX/" />
    <meta property="og:title" content="Rathish Gandhi — Senior UX/UI Designer" />
    <meta
      property="og:description"
      content="9+ years designing for the gap between complex systems and the people who have to use them. Product design across aviation, telecom, healthcare, and fintech."
    />
    <meta
      property="og:image"
      content="https://rathishux.github.io/Rathish.UX/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Ratz Gazette — Rathish Gandhi, Senior UX/UI Designer"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rathish Gandhi — Senior UX/UI Designer" />
    <meta
      name="twitter:description"
      content="9+ years designing for the gap between complex systems and the people who have to use them."
    />
    <meta
      name="twitter:image"
      content="https://rathishux.github.io/Rathish.UX/og-image.png"
    />
    <style>
      html, body { background-color: #f5f1e8; }
    </style>
    <script type="text/javascript">
      // GitHub Pages SPA redirect trick — https://github.com/rafgraph/spa-github-pages
      // Lets deep links like /work/kipi-bi survive a hard refresh on a project Pages site.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
